<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.w3.org/1999/xhtml"
      layout:decorate="~{_layout}">
<body>
<section layout:fragment="content">
    <h1>Log In</h1>
    <div class="text-bg-danger p-3 mb-3" th:if="${param.error}">Nutzername unbekannt oder falsches Passwort</div>
    <div class="text-bg-success p-3 mb-3" th:if="${param.logout}">Sie wurden ausgeloggt.</div>
    <form th:action="@{/login}" method="post">
        <div>
            <input class="form-control" type="text" name="username" placeholder="Nutzername"/>
        </div>
        <div>
            <input class="form-control" type="password" name="password" placeholder="Passwort"/>
        </div>
        <button class="btn btn-success" type="submit" value="Log in">Log In</button>
    </form>
</section>
</body>
</html>
